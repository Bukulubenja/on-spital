spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:HMS}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    # False deliberately: this property only auto-registers an MVC
    # *interceptor* version of open-session-in-view, which runs inside
    # DispatcherServlet — too late for TenantResolvingFilter, which sits
    # earlier in the Servlet filter chain. A real OpenEntityManagerInViewFilter
    # bean (see SecurityConfig) is registered explicitly instead, positioned
    # ahead of TenantResolvingFilter, so the whole request shares one bound
    # session. (A first attempt left this `true` and relied on the
    # interceptor — it silently didn't share a session with the filter
    # chain at all; caught by live end-to-end testing, not by unit tests.)
    open-in-view: false
    hibernate:
      # The schema is owned by Django's migrations. Spring Boot only ever
      # maps to it here, never alters it — never change this to update/create.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  # Suffix stripped from the Host header to find the subdomain, mirrors
  # Django's BASE_DOMAIN setting. Must match the Django .env value to
  # resolve the same tenants.
  base-domain: ${BASE_DOMAIN:lvh.me:8000}
  # DEBUG-only escape hatch for the X-Hospital-Subdomain header fallback,
  # mirrors Django's settings.DEBUG gate in TenantMiddleware. Never enable
  # this in a real deployment — see TenantResolvingFilter for why.
  debug: ${APP_DEBUG:true}
